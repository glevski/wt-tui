name: release

# Tags are plain versions (0.1.0), so match digits — this skips
# non-release tags.
on:
  push:
    tags: ["[0-9]*.[0-9]*.[0-9]*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go vet ./... && go test ./...

      # Same stamping as `make install` (see Makefile); asset names carry no
      # version so install.sh can fetch via the stable releases/latest URL.
      - name: Build release binaries
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          COMMIT="$(git rev-parse --short HEAD)"
          mkdir -p dist
          for target in darwin-arm64 darwin-amd64 linux-amd64 linux-arm64; do
            GOOS="${target%-*}" GOARCH="${target#*-}" CGO_ENABLED=0 \
              go build -trimpath \
                -ldflags "-s -w -X wt-tui/internal/cli.version=$VERSION -X wt-tui/internal/cli.commit=$COMMIT" \
                -o dist/wt-tui .
            tar -C dist -czf "dist/wt-tui-$target.tar.gz" wt-tui
            rm dist/wt-tui
          done
          cd dist && sha256sum *.tar.gz > SHA256SUMS

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}"
          dist/wt-tui-*.tar.gz dist/SHA256SUMS
          --title "${{ github.ref_name }}" --generate-notes
